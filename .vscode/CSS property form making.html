<!doctype html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Property Form Making</title>
    <link rel="stylesheet" href="CSS property form making.css">
</head>
<body>

    <header class="header">
     <div class="header-text">
        <h1>Student Portal</h1>
        <h3>Register for your profile</h3>
        </div>
    </header>

        
     <main>
        
        <section class="form-container">
             
          <h2>Registration form</h2><br><br>

        <form>

        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>
        
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>

        <label for="age">Age:</label><br>
        <select id="age" name="age">
            <option value="" disabled hidden selected>Select age</option>
            <option value="18 above">18 Above</option>
            <option value="18 below">18 Below</option>
            </select><br><br>



        <label>Gender:</label> <!--No need for 'for' attribute since it's a label for a group of radio buttons-->

        <div class="radio-group">

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
       
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        </div><br>

       

        <label>Skills:</label>

        <div class="skills-group">    

        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="css">
        <label for="css">CSS</label>

        <input type="checkbox" id="javascript" name="skills" value="javascript">
        <label for="javascript">JavaScript</label>
            
        </div><br>

        <!--'name' should be same to grp the radio/checkboxes, as in google or to developers 
        it is seen as- name:value i.e in skills either html,css or js was selected-->

        <label for="text">About:</label><br>
        <textarea id="text" name="text" rows="8" cols="30"> </textarea><br><br>
        <!--here no value is required in textarea and aslo there is ending tag for textarea-->

        <button type="submit">Submit</button>
        </form>
        </section>

        
        <section class="skills-container">
            <h2> My Skills </h2>
          

            <table>

               <caption>Technical Skills</caption>

             <thead>
                <tr>
                 <th>Skill</th>
                 <th>Level</th>
                 <th>Experience</th>
                 </tr>
             </thead>
                 
                 <tbody>

                <tr>
                    <td>HTML</td>
                    <td>Advanced</td>
                    <td>1 Year</td>
                </tr>

                <tr>
                  <td>CSS</td>
                  <td>Advanced</td>
                  <td>1 Year</td>
                </tr>

                 <tr>
                  <td>JS</td>
                  <td>Advanced</td>
                  <td>1 Year</td>
                </tr>

                 </tbody>
            </table>

            </section>

            </main>

            </body>
            </html>
